name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "notebooks/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, prod]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend -> ECR
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPO }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile \
            -t "$REG/$REPO:$TAG" -t "$REG/$REPO:latest" .
          docker push "$REG/$REPO:$TAG"
          docker push "$REG/$REPO:latest"

  frontend:
    name: Frontend -> S3 + CloudFront
    runs-on: ubuntu-latest
    needs: backend
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Build
        env:
          VITE_API_URL:           ${{ secrets.VITE_API_URL }}
          VITE_AWS_REGION:        ${{ secrets.AWS_REGION }}
          VITE_COGNITO_POOL_ID:   ${{ secrets.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          VITE_S3_DATA_BUCKET:    ${{ secrets.S3_DATA_BUCKET }}
        run: cd frontend && npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ secrets.S3_WEB_BUCKET }}/" \
            --delete --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          aws s3 cp frontend/dist/index.html "s3://${{ secrets.S3_WEB_BUCKET }}/index.html" \
            --cache-control "no-cache,must-revalidate"
